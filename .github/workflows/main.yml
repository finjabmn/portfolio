name: Deploy to netcup via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy files via FTPS
        env:
          FTP_HOST: ${{ secrets.SFTP_HOST }}
          FTP_PORT: ${{ secrets.SFTP_PORT }}
          FTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.TARGET }}
        run: |
          lftp -e "
          set net:max-retries 2
          set net:timeout 20
          set net:reconnect-interval-base 5
          set ftp:ssl-force true
          set ssl:verify-certificate no
          open -u $FTP_USERNAME,$FTP_PASSWORD ftp://$FTP_HOST:$FTP_PORT
          mirror -R ./ /$FTP_REMOTE_DIR --delete --verbose --parallel=5 --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .gitignore
          bye
          "
